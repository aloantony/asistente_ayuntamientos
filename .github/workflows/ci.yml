name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject whitespace errors in the change set
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: git diff --check "${BASE_SHA}...${GITHUB_SHA}"

      - name: Test Codex session coordination helper
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17@sha256:40b404964359299eefdd5f8518facf1886c562848cf4de13b6eaf91cb70c2b87
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://app:app@127.0.0.1:5432/app
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      DOCUMENT_STORAGE_ROOT: /tmp/asistente-ayuntamientos-ci-documents
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.12.8
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile backend
        run: python -m compileall -q app alembic

      - name: Apply and verify migrations
        run: |
          alembic heads
          # Keep the last revision already seen in persistent environments
          # executable before testing the current head.
          alembic upgrade 20260701_0020
          alembic upgrade head
          alembic check

      - name: Run backend test suite
        run: python -m pytest tests -q

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check frontend
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - repository
      - backend
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every CI job to pass
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "${REPOSITORY_RESULT}" = "success"
          test "${BACKEND_RESULT}" = "success"
          test "${FRONTEND_RESULT}" = "success"
