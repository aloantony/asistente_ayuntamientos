services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    network_mode: host
    command:
      ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    volumes:
      - document_storage:/var/lib/asistente_ayuntamientos/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    network_mode: host
    command:
      ["sh", "-c", "rq worker --url \"$REDIS_URL\" default"]
    volumes:
      - document_storage:/var/lib/asistente_ayuntamientos/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bop-archive-proxy:
    profiles: ["bop-archive"]
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SECRET_KEY: archive-proxy-does-not-expose-auth-routes-2026
      CORS_ALLOWED_ORIGINS: https://archive-proxy.invalid
      REDIS_URL: redis://127.0.0.1:6379/0
      BOP_ARCHIVE_PROXY_API_KEY: ${BOP_ARCHIVE_PROXY_API_KEY:-}
      BOP_ARCHIVE_PROXY_SIGNING_KEY: ${BOP_ARCHIVE_PROXY_SIGNING_KEY:-}
      BOP_ARCHIVE_PROXY_STORAGE_ROOT: /var/lib/asistente_ayuntamientos/bop_archive
      ORDINANCE_IMPORT_MAX_FETCH_BYTES: ${ORDINANCE_IMPORT_MAX_FETCH_BYTES:-15728640}
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    ports:
      - "127.0.0.1:8650:8650"
    networks:
      - bop_egress
    command:
      [
        "uvicorn",
        "app.ordinances.archive_proxy_service:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8650",
      ]
    volumes:
      - bop_archive:/var/lib/asistente_ayuntamientos/bop_archive

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  document_storage:
  bop_archive:

networks:
  bop_egress:
    driver: bridge
