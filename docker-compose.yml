x-gwc-admin-environment: &gwc-admin-environment
  GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?GEOSERVER_ADMIN_PASSWORD must be set}
  GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:?GEOSERVER_ADMIN_USER must be set}
  GEOWEBCACHE_DISK_QUOTA_CLEANUP_SECONDS: ${GEOWEBCACHE_DISK_QUOTA_CLEANUP_SECONDS:-60}
  GEOWEBCACHE_DISK_QUOTA_GIB: ${GEOWEBCACHE_DISK_QUOTA_GIB:-20}
  GEOWEBCACHE_DISK_QUOTA_MIN_FREE_GIB: ${GEOWEBCACHE_DISK_QUOTA_MIN_FREE_GIB:-5}
  GEOWEBCACHE_DISK_QUOTA_POLICY: ${GEOWEBCACHE_DISK_QUOTA_POLICY:-LRU}
  LOCAL_GEOSERVER_BASE_URL: ${LOCAL_GEOSERVER_BASE_URL:-http://127.0.0.1:8081/geoserver}
  LOCAL_GEOSERVER_TIMEOUT_SECONDS: ${LOCAL_GEOSERVER_TIMEOUT_SECONDS:-8}

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      # Publication is worker-only.  Remove its credentials from the web API
      # even though both services load the shared development env file.
      GEOSERVER_ADMIN_USER: ""
      GEOSERVER_ADMIN_PASSWORD: ""
      LOCAL_GEOSERVER_POSTGIS_PASSWORD: ""
      # Local reference delivery is the production default. Remote WMS
      # fallback requires an explicit operator opt-in.
      REFERENCE_REMOTE_PROXY_ENABLED: ${REFERENCE_REMOTE_PROXY_ENABLED:-false}
    network_mode: host
    command:
      ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    volumes:
      - document_storage:/var/lib/asistente_ayuntamientos/documents
      - reference_artifacts:/var/lib/asistente_ayuntamientos/reference-artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      gwc-bootstrap:
        condition: service_completed_successfully
        restart: true

  worker:
    build:
      context: ./backend
    # New reference artifacts are root-owned but share this private group with
    # the unprivileged GeoServer process (directories 0750, blobs 0640).
    user: "0:${REFERENCE_STORAGE_GID:-2000}"
    env_file:
      - .env
    network_mode: host
    command:
      ["sh", "-c", "rq worker --url \"$REDIS_URL\" default"]
    volumes:
      - document_storage:/var/lib/asistente_ayuntamientos/documents
      - reference_artifacts:/var/lib/asistente_ayuntamientos/reference-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      gwc-bootstrap:
        condition: service_completed_successfully
        restart: true

  reference-worker:
    build:
      context: ./backend
    env_file:
      - .env
    user: "0:${REFERENCE_STORAGE_GID:-2000}"
    network_mode: host
    command:
      ["python", "-m", "app.reference_layers.mirror_runtime", "worker"]
    volumes:
      - reference_artifacts:/var/lib/asistente_ayuntamientos/reference-artifacts
      # Scratch aislado del CAS servido y de las copias de seguridad. Permite
      # derivar productos autorizados sin conservar el fichero bruto.
      - reference_transient:/var/lib/asistente_ayuntamientos/reference-transient
    depends_on:
      postgres:
        condition: service_healthy
      gwc-bootstrap:
        condition: service_completed_successfully
        restart: true

  reference-scheduler:
    build:
      context: ./backend
    env_file:
      - .env
    user: "0:${REFERENCE_STORAGE_GID:-2000}"
    environment:
      GEOSERVER_ADMIN_USER: ""
      GEOSERVER_ADMIN_PASSWORD: ""
      LOCAL_GEOSERVER_POSTGIS_PASSWORD: ""
    network_mode: host
    command:
      ["python", "-m", "app.reference_layers.mirror_runtime", "scheduler"]
    volumes:
      - reference_artifacts:/var/lib/asistente_ayuntamientos/reference-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      gwc-bootstrap:
        condition: service_completed_successfully
        restart: true

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://127.0.0.1:8000}
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://127.0.0.1:8000}
      HOSTNAME: 127.0.0.1
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    network_mode: host
    depends_on:
      backend:
        condition: service_started
        restart: true

  postgres:
    build:
      context: ./postgres
    image: asistente-ayuntamientos-postgres:17-postgis-pgvector
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  geoserver:
    image: docker.osgeo.org/geoserver:3.0.0
    environment:
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?GEOSERVER_ADMIN_PASSWORD must be set}
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:?GEOSERVER_ADMIN_USER must be set}
      RUN_UNPRIVILEGED: "true"
      RUN_WITH_USER_UID: "999"
      RUN_WITH_USER_GID: ${REFERENCE_STORAGE_GID:-2000}
      CHANGE_OWNERSHIP_ON_FOLDERS: "/opt /opt/geoserver_data /var/lib/geowebcache"
      SKIP_DEMO_DATA: "true"
      # This path stores persistent GWC configuration, not the tile cache.
      # The explicit FileBlobStore below points tiles at the separate v3 mount.
      GEOWEBCACHE_CACHE_DIR: /opt/geoserver_data/gwc
    ports:
      - "127.0.0.1:${GEOSERVER_PORT:-8081}:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data
      # Versioned tile-only volume. The GWC REST bootstrap configures this
      # exact path as the default FileBlobStore before enabling disk quota.
      - type: volume
        source: geowebcache_tile_cache_v3
        target: /var/lib/geowebcache
        volume:
          nocopy: true
      - reference_artifacts:/mnt/reference_artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  gwc-bootstrap:
    build:
      context: ./backend
    environment: *gwc-admin-environment
    network_mode: host
    restart: "no"
    command:
      [
        "python",
        "-m",
        "app.reference_layers.gwc_bootstrap",
        "--cache-path",
        "/var/lib/geowebcache",
        "--wait-seconds",
        "180",
      ]
    volumes:
      - type: volume
        source: geowebcache_tile_cache_v3
        target: /var/lib/geowebcache
        read_only: true
        volume:
          nocopy: true
    depends_on:
      geoserver:
        condition: service_started
        # Compose-managed GeoServer updates/restarts rerun the gate; the
        # restart chain above then restarts consumers only after success.
        restart: true

  gwc-ops:
    profiles: ["operations"]
    build:
      context: ./backend
    environment: *gwc-admin-environment
    network_mode: host
    command:
      [
        "python",
        "-m",
        "app.reference_layers.gwc_quota",
        "--cache-path",
        "/var/lib/geowebcache",
      ]
    volumes:
      - type: volume
        source: geowebcache_tile_cache_v3
        target: /var/lib/geowebcache
        read_only: true
        volume:
          nocopy: true

  siur-recovery:
    profiles: ["operations"]
    build:
      context: .
      dockerfile: ops/siur-disaster-recovery.Dockerfile
    # The sources are private root/group-owned volumes. They remain read-only;
    # the only writable mount is an explicit operator-provided backup/drill
    # destination.
    user: "0:${REFERENCE_STORAGE_GID:-2000}"
    network_mode: host
    volumes:
      - reference_artifacts:/sources/reference_artifacts:ro
      - geoserver_data:/sources/geoserver_data:ro

volumes:
  postgres_data:
  document_storage:
  reference_artifacts:
  reference_transient:
  geoserver_data:
  geowebcache_tile_cache_v3:
