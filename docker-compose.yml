services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    network_mode: host
    command:
      ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    volumes:
      - document_storage:/var/lib/asistente_ayuntamientos/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    network_mode: host
    command:
      ["sh", "-c", "rq worker --url \"$REDIS_URL\" default"]
    volumes:
      - document_storage:/var/lib/asistente_ayuntamientos/documents
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://127.0.0.1:8000}
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://127.0.0.1:8000}
      HOSTNAME: 127.0.0.1
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    network_mode: host
    depends_on:
      - backend

  postgres:
    build:
      context: ./postgres
    image: asistente-ayuntamientos-postgres:17-postgis-pgvector
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  document_storage:
