services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      # Publication is worker-only.  Remove its credentials from the web API
      # even though both services load the shared development env file.
      GEOSERVER_ADMIN_USER: ""
      GEOSERVER_ADMIN_PASSWORD: ""
      LOCAL_GEOSERVER_POSTGIS_PASSWORD: ""
    network_mode: host
    command:
      ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "8000"]
    volumes:
      - document_storage:/var/lib/asistente_ayuntamientos/documents
      - reference_artifacts:/var/lib/asistente_ayuntamientos/reference-artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    network_mode: host
    command:
      ["sh", "-c", "rq worker --url \"$REDIS_URL\" default"]
    volumes:
      - document_storage:/var/lib/asistente_ayuntamientos/documents
      - reference_artifacts:/var/lib/asistente_ayuntamientos/reference-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  reference-worker:
    build:
      context: ./backend
    env_file:
      - .env
    user: "0:${REFERENCE_STORAGE_GID:-2000}"
    network_mode: host
    command:
      ["python", "-m", "app.reference_layers.mirror_runtime", "worker"]
    volumes:
      - reference_artifacts:/var/lib/asistente_ayuntamientos/reference-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      geoserver:
        condition: service_started

  reference-scheduler:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      GEOSERVER_ADMIN_USER: ""
      GEOSERVER_ADMIN_PASSWORD: ""
      LOCAL_GEOSERVER_POSTGIS_PASSWORD: ""
    network_mode: host
    command:
      ["python", "-m", "app.reference_layers.mirror_runtime", "scheduler"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://127.0.0.1:8000}
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://127.0.0.1:8000}
      HOSTNAME: 127.0.0.1
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    network_mode: host
    depends_on:
      - backend

  postgres:
    build:
      context: ./postgres
    image: asistente-ayuntamientos-postgres:17-postgis-pgvector
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  geoserver:
    image: docker.osgeo.org/geoserver:3.0.0
    environment:
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?GEOSERVER_ADMIN_PASSWORD must be set}
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:?GEOSERVER_ADMIN_USER must be set}
      RUN_UNPRIVILEGED: "true"
      SKIP_DEMO_DATA: "true"
    ports:
      - "127.0.0.1:${GEOSERVER_PORT:-8081}:8080"
    volumes:
      - geoserver_data:/opt/geoserver_data
      - geowebcache_data:/opt/geoserver_data/gwc
      - reference_artifacts:/mnt/reference_artifacts:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  document_storage:
  reference_artifacts:
  geoserver_data:
  geowebcache_data:
